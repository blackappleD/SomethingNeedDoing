on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: read

jobs:
  publish:
    # 只在上游仓库发布到 puni.sh；fork 通过 GitHub Release 发布到 blackappleD/DalamudPlugins
    if: github.repository == 'Jaksuhn/SomethingNeedDoing'
    runs-on: ubuntu-latest
    steps:
      - name: Build and publish
        uses: Jaksuhn/DynamisPublishAction@master
        with:
          plugin_id: 25
          publisher_key: ${{ secrets.PUBLISHER_KEY }}